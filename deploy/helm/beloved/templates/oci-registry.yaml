apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beloved.fullname" . }}-oci-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: oci-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oci-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oci-registry
    spec:
      containers:
        - name: registry
          image: registry:2.8.2
          ports:
            - containerPort: 5000
              name: registry
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: oci-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: oci-registry
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
      name: registry
  selector:
    app.kubernetes.io/name: oci-registry
